<div class="min-h-screen flex flex-col">
  @if (!isAdminRoute()) {
    <app-navbar />
  }
  <main class="flex-grow">
    <router-outlet />
  </main>
  @if (!isAdminRoute()) {
    <app-footer />
  }

  @if (!isAdminRoute() && cookieConsent.consent() === null) {
    <section class="fixed bottom-4 left-4 right-4 z-[100] mx-auto max-w-3xl comic-card !p-5 shadow-[5px_5px_0_var(--color-ink)]" aria-label="Ustawienia cookies">
      <h2 class="font-heading text-lg text-ink mb-2">Pliki cookie i analityka</h2>
      <p class="text-sm text-gray-600 mb-4">
        Używamy niezbędnego zapisu ustawień strony oraz opcjonalnej analityki odwiedzin. Możesz zaakceptować lub odrzucić analitykę.
      </p>
      <div class="flex flex-wrap gap-3">
        <button type="button" (click)="cookieConsent.accept()" class="comic-btn-primary text-sm py-2 px-4">Akceptuję</button>
        <button type="button" (click)="cookieConsent.reject()" class="comic-btn text-sm py-2 px-4 bg-surface text-ink">Odrzucam</button>
      </div>
    </section>
  }
</div>
