<div class="min-h-screen flex flex-col">
  @if (!isAdminRoute()) {
    <app-navbar />
  }
  <main class="flex-grow">
    <router-outlet />
  </main>
  @if (!isAdminRoute()) {
    <app-footer />
  }

  @if (showScrollTop()) {
    <button
      type="button"
      (click)="scrollToTop()"
      class="fixed bottom-6 right-6 z-[90] w-12 h-12 comic-btn-primary !p-0 flex items-center justify-center"
      aria-label="Wróć na górę strony"
      title="Wróć na górę strony">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7" />
      </svg>
    </button>
  }

  @if (!isAdminRoute() && cookieConsent.consent() === null) {
    <section class="fixed bottom-4 left-4 right-4 z-[100] mx-auto max-w-3xl comic-card !p-5 shadow-[5px_5px_0_var(--color-ink)]" aria-label="Ustawienia cookies">
      <h2 class="font-heading text-lg text-ink mb-2">Pliki cookie i analityka</h2>
      <p class="text-sm text-gray-600 mb-4">
        Używamy niezbędnego zapisu ustawień strony oraz analizy odwiedzin.
      </p>
      <div class="flex flex-wrap gap-3">
        <button type="button" (click)="cookieConsent.accept()" class="comic-btn-primary text-sm py-2 px-4">OK</button>
      </div>
    </section>
  }
</div>
